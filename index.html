<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>门店互动屏</title>
  <!-- iPad / iPhone「添加到主屏幕」后打开：没有网址栏，摄像头授权也不会跳出全屏 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="互动屏">
  <link rel="stylesheet" href="style.css?v=20261030o">
</head>
<body>
  <div id="stage">
    <div id="timer"></div>
    <div id="corner">
      <button id="fsBtn" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"
        fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="fsText"></span></button>
      <button id="lockBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></g></svg><span id="lockText"></span></button>
    </div>
    <div id="unlockZone" hidden></div>
    <header id="sign"><span id="storeName"></span></header>
    <button id="langBtn" hidden></button>

    <div id="character">
      <video id="charVideo" playsinline muted loop hidden crossorigin="anonymous"></video>
      <img id="charImg" alt="" hidden crossorigin="anonymous">
      <svg id="mascot" viewBox="0 0 200 260" aria-hidden="true">
        <g class="body">
          <ellipse cx="100" cy="215" rx="58" ry="40" class="outfit-dark"/>
          <rect x="70" y="180" width="60" height="60" rx="14" class="outfit"/>
          <g class="arm-left"><rect x="40" y="185" width="34" height="14" rx="7" class="outfit"/></g>
          <g class="arm-right"><rect x="126" y="185" width="34" height="14" rx="7" class="outfit"/>
            <circle cx="163" cy="192" r="10" class="skin"/></g>
          <circle cx="100" cy="110" r="72" class="skin"/>
          <path d="M28 100 Q30 30 100 32 Q170 30 172 100 Q150 60 100 62 Q50 60 28 100Z" class="hair"/>
          <circle cx="100" cy="34" r="18" class="hair"/>
          <g class="eyes"><ellipse cx="74" cy="112" rx="8" ry="10" fill="#222"/>
            <ellipse cx="126" cy="112" rx="8" ry="10" fill="#222"/></g>
          <circle cx="60" cy="135" r="9" fill="#ffb3b3" opacity=".7"/>
          <circle cx="140" cy="135" r="9" fill="#ffb3b3" opacity=".7"/>
          <path class="mouth" d="M84 140 Q100 156 116 140" stroke="#a33" stroke-width="5" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
    </div>

    <div id="bubble" class="hidden"></div>

    <div id="game" class="hidden">
      <div id="countdown"></div>
      <div id="hands"><div><small id="youLabel"></small><span id="youHand">❔</span></div>
        <b>VS</b><div><small id="meLabel"></small><span id="botHand">❔</span></div></div>
      <div id="tapPick">
        <button data-move="rock">✊</button><button data-move="scissors">✌️</button><button data-move="paper">✋</button>
      </div>
    </div>

    <div id="prize" class="hidden">
      <div id="prizeEmoji"></div>
      <div id="prizeName"></div>
      <div id="prizeCode"></div>
      <small id="claimText"></small>
    </div>

    <div id="photoAsk" class="hidden"><button id="photoYes"></button><button id="photoNo"></button></div>
    <div id="photo" class="hidden">
      <div id="photoFrame"><canvas id="photoCanvas"></canvas><div id="photoCount"></div></div>
      <div id="photoShare" class="hidden"><div id="photoQr"></div>
        <div class="share-side"><div id="photoTimer"></div><p id="photoMsg"></p><button id="photoDone"></button></div></div>
    </div>

    <footer id="hint"></footer>
    <template id="tapIcon"><svg class="tap" viewBox="0 0 24 24" aria-hidden="true">
      <path class="ripple" d="M7.2 6.6a4.8 4.8 0 0 1 9.6 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <g class="finger" fill="currentColor"><rect x="10.2" y="5" width="3.6" height="11" rx="1.8"/>
        <rect x="10.2" y="11" width="8.6" height="10.5" rx="3.2"/>
        <rect x="6.4" y="13.4" width="4.8" height="3.4" rx="1.7" transform="rotate(35 8.8 15.1)"/></g></svg></template>
    <button id="startBtn"></button>
    <div id="debug" class="hidden"><video id="cam" playsinline muted></video><pre id="dbgText"></pre></div>
  </div>
  <script src="config.js?v=20261030o"></script>
  <script src="config.local.js" onerror="0"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script type="module" src="app.js?v=20261030o"></script>
</body>
</html>
