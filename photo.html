<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>合照 Photo</title>
  <style>
    :root { --bg: #f6f3ee; --card: #fff; --text: #2a1f1a; --muted: #7a6e66; --brand: #8a2b1a; --brand-text: #fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1b1714; --card: #26201c; --text: #f1e9e1; --muted: #a99d93; --brand: #d0644c; }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); text-align: center;
      font: 16px/1.5 -apple-system, "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
    h1 { font-size: 22px; margin: 0 0 16px; }
    img { width: 100%; border-radius: 12px; box-shadow: 0 6px 24px #0003; background: var(--card); }
    a.btn { display: block; margin: 16px 0 8px; padding: 14px; border-radius: 12px; background: var(--brand);
      color: var(--brand-text); text-decoration: none; font-weight: 600; font-size: 17px; }
    p { color: var(--muted); font-size: 14px; margin: 6px 0; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">我们的合照 · Our photo</h1>
    <img id="pic" alt="合照 Photo" hidden>
    <a id="save" class="btn" download="photo.jpg" hidden>保存照片 Save photo</a>
    <p id="tip" hidden>如果按钮没反应，请长按照片保存。<br>If the button doesn't work, press and hold the photo to save it.</p>
    <p id="msg">加载中… Loading…</p>
    <p>照片 24 小时后自动删除。Photos are deleted after 24 hours.</p>
  </main>
  <script src="config.js?v=20261030f"></script>
  <script src="config.local.js" onerror="0"></script>
  <script>
    (async () => {
      const C = window.APP_CONFIG, msg = document.getElementById("msg");
      const id = new URLSearchParams(location.search).get("id") || "";
      try {
        const res = await fetch(`${C.backend.url}/rest/v1/rpc/get_photo`, {
          method: "POST",
          headers: { apikey: C.backend.key, Authorization: `Bearer ${C.backend.key}`, "Content-Type": "application/json" },
          body: JSON.stringify({ p_id: id }),
        });
        const data = res.ok ? await res.json() : null;
        if (!data) throw new Error("not found");
        const url = "data:image/jpeg;base64," + data;
        const pic = document.getElementById("pic"), save = document.getElementById("save");
        pic.src = url; save.href = url; save.download = `photo-${id.slice(0, 8)}.jpg`;
        pic.hidden = save.hidden = document.getElementById("tip").hidden = false;
        msg.hidden = true;
      } catch {
        msg.textContent = "照片已过期或不存在。This photo has expired or doesn't exist.";
      }
    })();
  </script>
</body>
</html>
