<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>合照 Photo</title>
  <style>
    :root { --bg: #f6f3ee; --card: #fff; --text: #2a1f1a; --muted: #7a6e66; --brand: #8a2b1a; --brand-text: #fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1b1714; --card: #26201c; --text: #f1e9e1; --muted: #a99d93; --brand: #d0644c; }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); text-align: center;
      font: 16px/1.5 -apple-system, "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
    h1 { font-size: 22px; margin: 0 0 16px; }
    img { width: 100%; border-radius: 12px; box-shadow: 0 6px 24px #0003; background: var(--card); }
    a.btn { display: block; margin: 16px 0 8px; padding: 14px; border-radius: 12px; background: var(--brand);
      color: var(--brand-text); text-decoration: none; font-weight: 600; font-size: 17px; }
    p { color: var(--muted); font-size: 14px; margin: 6px 0; }
    p.lead { color: var(--text); font-size: 17px; margin: 16px 0 4px; }
    a.wa { background: #25d366; color: #0b2e17; }
    button.btn { width: 100%; border: 0; font: inherit; font-weight: 600; font-size: 17px; padding: 14px; border-radius: 12px;
      background: var(--card); color: var(--text); box-shadow: inset 0 0 0 2px var(--brand); cursor: pointer; }
    button.link { background: none; border: 0; color: var(--muted); text-decoration: underline; font: inherit; font-size: 14px;
      padding: 8px; cursor: pointer; }
    #teaser { filter: blur(14px) saturate(1.2); transform: scale(.96); max-height: 44vh; object-fit: cover; }   /* 按钮要一眼看到，不用往下滑 */
  </style>
</head>
<body>
  <main>
    <h1 id="title">我们的合照 · Our photo</h1>
    <!-- 店家设了 WhatsApp 社群：先加入，再看照片 -->
    <section id="join" hidden>
      <img id="teaser" alt="">
      <p class="lead">加入 <b class="store"></b> 的 WhatsApp 社群，就能下载这张照片 🎁<br>
        Join <b class="store"></b> on WhatsApp to get your photo</p>
      <a id="joinBtn" class="btn wa">加入 WhatsApp 社群 · Join on WhatsApp</a>
      <button id="skipBtn" class="link" type="button">我已经加入了 · I've already joined</button>
    </section>
    <section id="photoBox" hidden>
      <img id="pic" alt="合照 Photo">
      <a id="save" class="btn" download="photo.jpg">保存照片 Save photo</a>
      <button id="share" class="btn" type="button" hidden>分享给朋友 · Share</button>
      <p>如果按钮没反应，请长按照片保存。<br>If the button doesn't work, press and hold the photo to save it.</p>
    </section>
    <p id="msg">加载中… Loading…</p>
    <p>照片 24 小时后自动删除。Photos are deleted after 24 hours.</p>
  </main>
  <script src="config.js?v=20261030q"></script>
  <script src="config.local.js" onerror="0"></script>
  <script>
    (async () => {
      const C = window.APP_CONFIG, $ = (id) => document.getElementById(id), msg = $("msg");
      const id = new URLSearchParams(location.search).get("id") || "";
      const WA = /^https:\/\/(chat\.whatsapp\.com|wa\.me|(www\.)?whatsapp\.com)\//;   // 只接受 WhatsApp 的链接
      const call = async (fn) => {
        const res = await fetch(`${C.backend.url}/rest/v1/rpc/${fn}`, {
          method: "POST",
          headers: { apikey: C.backend.key, Authorization: `Bearer ${C.backend.key}`, "Content-Type": "application/json" },
          body: JSON.stringify({ p_id: id }),
        });
        if (!res.ok) throw res.status;
        return res.json();
      };
      try {
        let info;
        try { info = await call("photo_page"); }
        catch (e) { if (e !== 404) throw e; info = { data: await call("get_photo") }; }   // 数据库还没更新到新版时的退路
        if (!info?.data) throw new Error("not found");
        const url = "data:image/jpeg;base64," + info.data, name = `photo-${id.slice(0, 8)}.jpg`;
        const names = info.store || {};
        const store = (navigator.language.startsWith("zh") && names.zh) || names.en || names.zh || "";
        document.querySelectorAll(".store").forEach((b) => (b.textContent = store));
        if (store) document.title = `${store} · 合照 Photo`;
        msg.hidden = true;

        const showPhoto = async () => {
          $("join").hidden = true;
          $("pic").src = url; $("save").href = url; $("save").download = name;
          $("photoBox").hidden = false;
          // 手机支持的话，直接分享照片到 WhatsApp / Instagram 等
          const file = new File([await (await fetch(url)).blob()], name, { type: "image/jpeg" });
          if (navigator.canShare?.({ files: [file] })) {
            $("share").hidden = false;
            $("share").onclick = () => navigator.share({ files: [file], title: store }).catch(() => {});
          }
        };
        const link = WA.test(info.whatsapp || "") ? info.whatsapp : "";
        const seen = "joined:" + link;
        let joined = false;
        try { joined = !!localStorage.getItem(seen); } catch {}
        if (!link || joined) return showPhoto();

        // 点了加入就记下来：WhatsApp 打开后回到这一页，照片已经出来了（WhatsApp 不会通知我们有没有真的加入）
        $("teaser").src = url;
        $("join").hidden = false;
        $("joinBtn").href = link;
        const unlock = () => { try { localStorage.setItem(seen, "1"); } catch {} setTimeout(showPhoto, 800); };
        $("joinBtn").onclick = unlock;
        $("skipBtn").onclick = unlock;
      } catch {
        msg.textContent = "照片已过期或不存在。This photo has expired or doesn't exist.";
      }
    })();
  </script>
</body>
</html>
